name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*', 'android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Rust GNU and MinGW
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          if (-not (Test-Path 'C:\msys64\mingw64\bin\windres.exe')) {
            throw 'Expected MinGW-w64 is missing from the Windows runner.'
          }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Run default tests and build portable executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SHUNet-windows-x64
          path: dist/windows/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build debug APK and run Android Lint
        working-directory: shunet-android
        run: sh ./gradlew --no-daemon --console plain :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SHUNet-android-debug-preview
          path: shunet-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
