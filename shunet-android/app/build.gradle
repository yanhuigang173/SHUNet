plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shunet.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shunet.android'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
