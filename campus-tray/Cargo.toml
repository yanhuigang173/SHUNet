[package]
name = "shunet"
version = "0.14.3"
edition = "2024"
description = "SHUNet 校园网托盘工具"
license = "MIT"
repository = "https://github.com/yanhuigang173/SHUNet"
readme = "README.md"
keywords = ["shunet", "campus-network", "windows", "tray"]
categories = ["network-programming"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
encoding_rs = "0.8"
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "charset", "native-tls", "socks"] }
winreg = "0.56"
windows = { version = "0.62.2", features = ["Networking_Connectivity", "Networking_NetworkOperators", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinInet", "Win32_Networking_WinSock",
    "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography",
    "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_StationsAndDesktops",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
